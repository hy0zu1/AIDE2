<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Creative Agent</title>
</head>
<body>
  <p id="status" role="status" aria-live="polite">채팅에 연결하는 중입니다...</p>
  <div id="webchat" style="height: 600px"></div>
  <script src="https://cdn.botframework.com/botframework-webchat/4.18.0/webchat.js"></script>
  <script>
    const BROKER_URL = "https://dl-broker-juwon-4jt3z.azurewebsites.net/api/directlineToken";
    const SEALED = "mGfBS44pD7gASiKw_z8TL83Ngnmi0cUMDdfWUTZjwspILBV0dxoQr3X2UQZLjdH7kR6MFir8owrBdFsvDQykjbkDGF2PYsGyKmCuy42YQTujZVdwLaBfR6FpesKTwn1Hbj1TkXMvdw8RNcQvNoBVBSsgdVOnAuY7p56QAuQ3wN8uqKqRTkOcMd3nzZunwEWeaVO0YYDT-W3NU94IpVTK3O_m30bbzBPMUr1QPQkFk63-kYpew9ScKk7a5oM5kArWlkXJwFYqQm2FZRSHvCaY7HjOfeNia3_ASf8GOIfW_kO-DZc1IDdp5vdKHXRIrFxahO9R-V2AI-n9r3a8J7pPA0U_Mo65LqLxcQhERKG_gGsq1w1PL8Z2iMotrBzngZoZgc6bJnlnScGCEt88UGnb15HKb36uViqz1NX6DdmHL2pnivld3Y0EV0Wxb9SRCEuGfGrDwkUlOHIrGGxFQHozPSaM7zjXII-biEGdmpFUA2MwKtNEAym4kR3x2secLZ4vUFmlmrWF6XBx1JJFagMI7q_qw5ZXSJydNix-eKM6WW54nfRka3RVjDKUnQ1GVrAT5_AGhTlVMCW5LD7XLKhVyr1BQ1D2o6kumV7PAYa3TjuubNksiYbRqa5rLYiI0olceTvGTrxkoumLmdcp";
    const status = document.getElementById("status");

    function showError(message) {
      status.hidden = false;
      status.textContent = message;
    }

    async function connect() {
      if (!window.WebChat ||
          typeof WebChat.createDirectLine !== "function" ||
          typeof WebChat.renderWebChat !== "function") {
        showError("채팅 구성 요소를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.");
        return;
      }

      let response;
      try {
        // Keep this a simple CORS request; the broker may not support preflight.
        response = await fetch(BROKER_URL, {
          method: "POST",
          body: JSON.stringify({ sealed: SEALED })
        });
      } catch {
        showError("서버에 연결하지 못했습니다. 네트워크와 배포 주소를 확인해 주세요.");
        return;
      }
      if (!response.ok) {
        showError("서버가 연결 요청을 처리하지 못했습니다 (HTTP " + response.status + ").");
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch {
        showError("서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      if (!data || typeof data.token !== "string" || !data.token.trim()) {
        showError("서버에서 연결 토큰을 받지 못했습니다. 암호와 배포 주소를 확인해 주세요.");
        return;
      }

      try {
        const directLine = WebChat.createDirectLine({ token: data.token });
        status.hidden = true;
        directLine.postActivity({
          type: "event", name: "startConversation", from: { id: "user" }
        }).subscribe({
          error: () => showError("첫 인사를 요청하지 못했습니다. 채팅창에 메시지를 입력해 주세요.")
        });
        WebChat.renderWebChat({ directLine, locale: "ko-KR" }, document.getElementById("webchat"));
      } catch {
        showError("채팅을 시작하지 못했습니다. 새로고침 후 다시 시도해 주세요.");
      }
    }

    connect();
  </script>
</body>
</html>
